[project]
name = "rug-research"
version = "0.1.0"
description = "Interactive numerical rug research"
requires-python = ">=3.15"
dependencies = ["numpy>=2", "matplotlib>=3.9", "pillow>=11", "cmasher>=1.9", "jupytext>=1.17", "ipykernel>=6", "ipython>=9", "jupyterlab>=4", "ipywidgets>=8", "json5>=0.17"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ruglab"
module-root = ""

[dependency-groups]
dev = ["pytest>=8", "nbclient>=0.10", "ruff>=0.11"]

[tool.jupytext]
formats = "ipynb,py:percent"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: exercises real Git hooks, indexed Ruff checks, or a fresh Jupyter kernel"]
