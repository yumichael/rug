# Maintained interactive Python and its tooling; dated proof artifacts remain frozen.
line-length = 120
target-version = "py315"
force-exclude = true
include = ["research/interactive/**/*.py", "scripts/lint_staged_python.py"]

[format]
quote-style = "preserve"
indent-style = "space"
skip-magic-trailing-comma = false

