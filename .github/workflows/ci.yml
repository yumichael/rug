name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown formatting and lint (rumdl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:markdown

  python-lint:
    name: Python formatting and lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: research/interactive/uv.lock
      - run: uv sync --locked --project research/interactive
      - run: uv run --locked --project research/interactive ruff format --check .
      - run: uv run --locked --project research/interactive ruff check .
      - run: uv run --locked --project research/interactive python scripts/lint_staged_python.py --imports

  python-test:
    name: Python tests and fresh-kernel notebook
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/interactive
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: research/interactive/uv.lock
      - run: uv sync --locked
      - run: uv run --locked pytest -q
        env:
          MPLBACKEND: Agg
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
